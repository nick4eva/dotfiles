name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 60
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: make test
        env:
          UBUNTU_VERSION: '${{ matrix.os }}'
